<style>

.bc{color:var(--mu)}.bc b{color:var(--tx)}.sp{flex:1}.sr2{position:relative;width:min(360px,35vw)}.sr2 input{width:100%;padding:10px 12px 10px 38px;border-radius:12px;background:var(--bg)}.sr2 .i{position:absolute;left:12px;top:11px;color:var(--mu)}
main{padding:30px 40px 70px;max-width:1500px}h1{font-size:30px;letter-spacing:-.8px;margin:2px 0 4px}h2{font-size:16px;margin:0 0 2px}.s{color:var(--mu);margin:0 0 14px}
.ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}.bt{display:flex;gap:10px;flex-wrap:wrap}

.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:18px}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:1fr 1fr}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:20px;min-width:0}.kc{display:flex;flex-direction:column;gap:2px}.kc .t{display:flex;justify-content:space-between;font-weight:600;color:var(--mu)}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:9px;background:var(--bg);color:var(--mu)}.y{background:var(--okb);color:var(--ok)}.n{background:var(--erb);color:var(--er)}.w{background:var(--wab);color:var(--wa)}.b{background:var(--al);color:var(--ac)}
button,input,select,textarea{font:inherit;padding:9px 14px;border-radius:12px;border:1px solid var(--ln);background:#fff;color:var(--tx)}button{cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}button.p{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 6px 16px #4f6bff40}button:disabled{opacity:.6}button.x{padding:6px 10px;color:var(--er)}

.fm{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fm input{flex:1;min-width:200px}label{font-weight:600;display:block;margin:10px 0 6px}.ck{display:flex;align-items:center;gap:10px;font-weight:500;margin:8px 0}.ck input{width:18px;height:18px;padding:0}

@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}main{padding:20px 16px 60px}aside{position:fixed;z-index:15;height:100vh}.sr2{width:46vw;min-width:130px}.gr{left:auto;right:0;min-width:min(320px,90vw)}}@media(max-width:600px){.bc{display:none}}

<style id="landing-css">
/* ===== LANDING PAGE (logged-out homepage only). Everything is scoped under .lp so the dashboard is untouched ===== */
.lp{--ink:#0f1b33;--sig:#4f6bff;--sig2:#3550f0;--pap:#f4f6fc;--wht:#fff;--mut:#5d6985;--rul:#dfe4f1;--hit:#12a574;--hitb:#dff5ec;--miss:#e5533d;--missb:#fde9e5;--cit:#f0a020;
 font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--pap);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.lp *{box-sizing:border-box}
.lp h1,.lp h2,.lp h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.03em;line-height:1.04;font-weight:800}
.lp p{margin:0}
.lp a{color:inherit}
.lp :focus-visible{outline:3px solid var(--sig);outline-offset:3px;border-radius:8px}
.lp .wrap{width:min(1180px,100% - 48px);margin:0 auto}
.lp button{font:inherit;cursor:pointer}
.lp .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:16px;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s}
.lp .btn:hover{background:var(--wht)}
.lp .btn.pri{background:var(--sig);border-color:var(--sig);color:#fff;box-shadow:0 10px 26px #4f6bff55}
.lp .btn.pri:hover{background:var(--sig2);transform:translateY(-1px)}
.lp .btn.ink{background:var(--ink);color:#fff}
.lp .btn.ink:hover{background:#1b2c52}

/* nav */
.lp nav.top{position:sticky;top:0;z-index:40;transition:background .2s,box-shadow .2s}
.lp nav.top.stuck{background:#f4f6fcdd;backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--rul)}
.lp nav.top .wrap{display:flex;align-items:center;gap:28px;height:72px}
.lp .brand{display:flex;align-items:center;gap:11px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none}
.lp .mark{width:38px;height:38px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.lp nav.top .links{display:flex;gap:26px;margin-left:auto}
.lp nav.top .links a{text-decoration:none;color:var(--mut);font-weight:500;font-size:15.5px}
.lp nav.top .links a:hover{color:var(--ink)}
.lp nav.top .btn{padding:10px 20px;font-size:15px}

/* hero */
.lp .hero{padding:44px 0 90px}
.lp .hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6.4fr);gap:56px;align-items:center}
.lp .hero h1{font-size:clamp(42px,5.2vw,76px)}
.lp .hero .lede{margin-top:26px;font-size:19px;color:var(--mut);max-width:34em}
.lp .hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.lp .hero .fine{margin-top:22px;font-size:14.5px;color:var(--mut)}
.lp .hero h1 .ln{display:block;overflow:hidden}
.lp .hero h1 .ln span{display:block;transform:translateY(105%);animation:lpUp .8s cubic-bezier(.2,.8,.2,1) forwards}
.lp .hero h1 .ln:nth-child(2) span{animation-delay:.12s}.lp .hero h1 .ln:nth-child(3) span{animation-delay:.24s}
@keyframes lpUp{to{transform:none}}

/* scope (simulator) */
.lp .scope{background:var(--wht);border:1px solid var(--rul);border-radius:26px;box-shadow:0 30px 70px -30px #0f1b3355,0 2px 0 #fff inset;overflow:hidden}
.lp .scope .bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rul);background:linear-gradient(#fff,#fafbff)}
.lp .scope .bar b{font-size:14px;font-weight:600}
.lp .scope .bar small{margin-left:auto;color:var(--mut);font-size:12.5px}
.lp .dots{display:flex;gap:6px}.lp .dots i{width:10px;height:10px;border-radius:50%;background:var(--rul)}
.lp .qs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px 4px}
.lp .qs button{border:1.5px solid var(--rul);background:var(--wht);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;color:var(--mut);transition:all .15s}
.lp .qs button:hover{border-color:var(--sig);color:var(--ink)}
.lp .qs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.lp .askrow{padding:12px 18px 0}
.lp .ask{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em;line-height:1.25;min-height:2.5em}
.lp .ans{margin:12px 18px 0;padding:16px 18px;border-radius:16px;background:var(--pap);font-size:15.5px;line-height:1.6;min-height:176px;position:relative}
.lp .ans .who{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.lp .ans mark{background:var(--hitb);color:#0b6b4b;border-radius:6px;padding:1px 6px;font-weight:600;box-shadow:inset 0 -2px 0 var(--hit)}
.lp .ans mark.rv{background:#e9edf7;color:#3a4766;box-shadow:inset 0 -2px 0 #b7c0d8}
.lp .ans .src{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lp .ans .src span{font-size:12.5px;padding:3px 10px;border-radius:8px;background:#fff;border:1px solid var(--rul);color:var(--mut)}
.lp .ans .src span.me{border-color:var(--cit);color:#8a5a00;background:#fff7e6;font-weight:600}
.lp .caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--sig);margin-left:2px;vertical-align:-2px;animation:lpBlink .9s steps(1) infinite}
@keyframes lpBlink{50%{opacity:0}}
.lp .read{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:18px}
.lp .ring{position:relative;width:112px;height:112px}
.lp .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.lp .ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.lp .ring .tr{stroke:#e8ecf7}.lp .ring .fg{stroke:var(--sig);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.lp .ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1}
.lp .ring .num small{display:block;font-family:"Instrument Sans",sans-serif;font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:3px}
.lp .meters{display:grid;gap:11px}
.lp .meter{display:grid;grid-template-columns:116px 1fr auto;gap:12px;align-items:center;font-size:14px}
.lp .meter .t{height:9px;border-radius:9px;background:#e8ecf7;overflow:hidden}
.lp .meter .t i{display:block;height:100%;border-radius:9px;background:var(--sig);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lp .meter:nth-child(2) .t i{background:var(--cit)}
.lp .meter b{font-variant-numeric:tabular-nums;min-width:96px;text-align:right;font-weight:600}
.lp .flip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 18px;border-top:1px solid var(--rul);background:#fafbff}
.lp .seg{display:inline-flex;background:#e8ecf7;border-radius:12px;padding:4px}
.lp .seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);transition:all .2s}
.lp .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0f1b3320}
.lp .flip .note{font-size:14px;color:var(--mut);flex:1;min-width:200px}
.lp .flip .note b{color:var(--ink)}

/* section shell */
.lp section{padding:104px 0}
.lp .head{max-width:760px;margin-bottom:52px}
.lp .head h2{font-size:clamp(34px,4.2vw,56px)}
.lp .head p{margin-top:18px;color:var(--mut);font-size:19px;max-width:38em}

/* tour */
.lp .tour{background:var(--ink);color:#fff;border-radius:44px;margin:0 20px;padding:96px 0}
.lp .tour .head p{color:#aab5d3}
.lp .tour .grid{display:grid;grid-template-columns:minmax(0,4.2fr) minmax(0,7fr);gap:40px;align-items:start}
.lp .tabs{display:grid;gap:6px}
.lp .tabs button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#aab5d3;padding:18px 20px;border-radius:16px;transition:background .2s,color .2s;position:relative}
.lp .tabs button b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;letter-spacing:-.02em;color:inherit;font-weight:700}
.lp .tabs button span{display:block;font-size:15px;margin-top:4px;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s,opacity .3s}
.lp .tabs button:hover{color:#fff}
.lp .tabs button[aria-selected=true]{background:#17284d;color:#fff}
.lp .tabs button[aria-selected=true] span{max-height:90px;opacity:1}
.lp .tabs button[aria-selected=true]::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:4px;background:var(--sig)}
.lp .pane{background:#fff;color:var(--ink);border-radius:26px;padding:28px;min-height:430px;box-shadow:0 40px 80px -40px #000a}
.lp .pane h3{font-size:22px;letter-spacing:-.02em}
.lp .pane .sub{color:var(--mut);font-size:14.5px;margin:4px 0 18px}
.lp .chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:9px;background:#eef1f8;color:var(--mut)}
.lp .chip.y{background:var(--hitb);color:#0b6b4b}.lp .chip.n{background:var(--missb);color:#b43a27}.lp .chip.w{background:#fff3da;color:#8a5a00}.lp .chip.b{background:#e9edff;color:#3550f0}
.lp .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rul)}
.lp .row:last-child{border:0}
.lp .row b{font-weight:600;font-size:15px;display:block}.lp .row small{color:var(--mut);font-size:13px}
.lp .bars .br{display:grid;grid-template-columns:130px 1fr 48px;gap:12px;align-items:center;margin:15px 0;font-size:14.5px}
.lp .bars .tr{height:12px;background:#eef1f8;border-radius:9px;overflow:hidden}
.lp .bars .tr i{display:block;height:100%;border-radius:9px;background:#b9c3e2;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lp .bars .br.me .tr i{background:var(--sig)}
.lp .bars .br b{text-align:right;font-variant-numeric:tabular-nums}
.lp .chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rul)}
.lp .chk:last-child{border:0}.lp .chk b{display:block;font-size:15px}.lp .chk small{color:var(--mut);font-size:13.5px}
.lp .tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;font-size:13px;font-weight:700}
.lp .tick.ok{background:var(--hitb);color:#0b6b4b}.lp .tick.no{background:var(--missb);color:#b43a27}
.lp .todo{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rul);align-items:flex-start}
.lp .todo:last-child{border:0}
.lp .todo input{width:20px;height:20px;margin-top:3px;padding:0;accent-color:var(--sig);flex:none}.lp .todo label{margin:0;display:block;font-weight:400}
.lp .todo label{cursor:pointer}.lp .todo b{display:block;font-size:15px;transition:color .2s}
.lp .todo input:checked+label b{text-decoration:line-through;color:var(--mut)}
.lp .todo small{display:block;color:var(--mut);font-size:13.5px;margin:2px 0 7px}
.lp .rep{border-radius:18px;background:var(--ink);color:#fff;padding:22px 24px;margin-bottom:14px}
.lp .rep small{opacity:.7;font-size:13px}.lp .rep h4{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;margin:6px 0 4px;letter-spacing:-.02em}
.lp .repg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lp .repg div{border:1px solid var(--rul);border-radius:14px;padding:14px}
.lp .repg b{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;letter-spacing:-.03em;display:block}
