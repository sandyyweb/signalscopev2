if(!CONFIGURED){$("#root").innerHTML='<div class="au">'+LOGO+'<div class="c"><h2>Setup needed</h2>'+(LIB?'<p>Set <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> near the top of the script (Supabase → Project Settings → API).</p>':'<p>The Supabase library could not be loaded. Check your connection and reload.</p>')+'</div></div>'}
else sb.auth.onAuthStateChange((ev,ses)=>{if(ev=="PASSWORD_RECOVERY")setTimeout(setNewPassword,300);if(ses){S.email=ses.user.email;boot()}else{S={...S,org:null,brands:[],brand:null,view:"overview",mode:"in",d:null};authView()}});
</script></body></html>
